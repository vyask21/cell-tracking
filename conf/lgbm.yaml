# First real model. Untuned on purpose. Tuning comes after the feature set is
# stable, not before.
name: lgbm_default
target: TARGET
id_col: id
metric: auc
seed: 42

cv:
  scheme: stratified
  n_splits: 5

model:
  kind: lightgbm
  task: binary          # binary | regression
  num_boost_round: 2000
  early_stopping_rounds: 100
  params:
    objective: binary
    learning_rate: 0.05
    num_leaves: 63
    colsample_bytree: 0.8
    subsample: 0.8
    subsample_freq: 1
    min_child_samples: 20

features:
  drop: []
