# One variable against conf/unet50_edge.yaml: the solver.
#
# unet50_edge.yaml scores links with the pack's edge head and then solves each
# frame pair on its own with an optimal assignment. This keeps the identical
# cost and replaces the solver with the pack's global ILP, which optimises the
# whole video at once under flow conservation.
#
# That difference is the point. A per-frame assignment is optimal inside its
# pair and blind across pairs, so it cannot use the fact that a link at t makes
# a link at t+1 more or less plausible. No cost function fixes that; only a
# global solve does. It is also the remaining structural difference between our
# 0.804 and the 0.908 the public notebooks reach on these same weights.
#
# Divisions: the ILP handles them as a constraint rather than through
# `add_divisions`, so `max_division_um` does not apply here. `division_weight`
# is the price of a fork. The pack's default of 1.0 is kept, since the division
# term is bounded at 0.02 to 0.04 and this config is not the place
# to reopen it.
name: unet50_ilp_link
seed: 42

cv:
  scheme: leave_one_embryo_out

detect:
  # Identical to conf/unet50.yaml and conf/unet50_edge.yaml.
  backend: unet
  det_threshold: 0.9550
  pool_kernel_um: 5.0
  det_tta: false
  device: auto

link:
  backend: ilp                 # distance | learned | ilp
  # Identical to conf/unet50_edge.yaml, so the candidate set and its scores are
  # the same and the solver is the only thing that changes.
  edge_activation: softmax
  edge_threshold: 0.05
  max_link_um: 7.0
  # The pack's own objective weights, unchanged. Tuning these is a later config
  # and only after the solver itself is shown to be worth having.
  ilp_edge_weight: -1.0
  ilp_appearance_weight: 0.1
  ilp_disappearance_weight: 0.1
  ilp_division_weight: 1.0
  # Branch and bound has no predictable runtime, so the solve is capped and the
  # cap is a config value rather than a constant buried in the module.
  #
  # 600 was the first value here and it was badly wrong. On the two largest
  # held-out videos the solve was cut off and returned a partial answer, which
  # scored 0.4196 against the assignment's 0.6911 on 6bba_3abfe10a. Left to
  # finish, the same solve on the same problem scores 0.7316. A cut-off
  # branch-and-bound hands back whichever feasible solution it is holding, and a
  # feasible solution to this model can carry thousands of spurious edges, so a
  # truncated solve is far worse than never solving.
  #
  # Two changes follow. The budget is raised to cover the largest videos seen,
  # which solved in 568s and needed no gap to do it, and `src.link_ilp` now
  # refuses a truncated solve rather than returning it, so the pipeline falls
  # back to the per-frame assignment instead. The budget bounds runtime; the
  # fallback bounds damage.
  ilp_num_threads: 1
  # 0.01 and 0.0 reached the identical solution on the largest video, same edges
  # and same score, and the gap did not save time there either. Kept at 0.0
  # since it buys nothing on this data.
  ilp_gap: 0.0
  ilp_timeout_s: 1800
  # Global wall-clock budget for linking across the whole run, which the
  # per-video cap does not provide: 200 videos each allowed 1800s is 100 hours.
  # Measured on Kaggle at 24s detect and a link cost scaling as nodes^1.79, the
  # held-out node distribution projects about 5.9h for 200 videos, while the four
  # example datasets, which happen to average 1.74x more nodes, project 12.6h and
  # would blow the 12 hour ceiling. Rather than bet on which distribution the
  # hidden set follows, this guarantees the notebook finishes: once the budget is
  # spent the rest link with the assignment, which costs 0.0182 rather than the
  # whole submission.
  ilp_total_budget_s: 28800
