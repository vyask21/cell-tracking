# One variable against conf/unet50_calib.yaml: safe divisions on.
#
# Why this is worth a submission despite an inconclusive screen. Our pipeline has
# never scored on the division term. A one-to-one linker cannot: divisions are
# nodes with two outgoing edges and an assignment gives every node at most one.
# That term carries 0.1 of the available 1.1, and every submission this repo has
# made has forfeited all of it. The held-out 19 measured 0 division true
# positives before this config and 3 after.
#
# Why the screen cannot settle it. The 19 held-out samples contain 19 ground
# truth divisions in total, spread over 12 samples, most of them carrying one.
# The division Jaccard is micro-averaged over pooled counts, so its denominator
# here is 19, and a bootstrap that resamples whole samples cannot resolve a
# change on a denominator that small. Four independent parameterisations all came
# out positive, from +0.0024 to +0.0049, with every interval spanning zero and
# P(>0) between 0.79 and 0.91. That pattern is a real effect the instrument
# cannot measure, not an absent one.
#
# The public split is roughly 58 videos and the private roughly 141, so the
# leaderboard carries several times the division evidence our screen does. This
# is a case where a submission is the better instrument, which is unusual here
# and is the reason it is being spent.
#
# Screened arms, weighted over the 19, total = adj edge Jaccard + 0.1 * division:
#
#   all              0.8975   divJ 0.0000   0tp /  1fp / 19fn
#   parent 8.0 sister 11.0    0.8999   divJ 0.0484   3tp / 43fp / 16fn
#   parent 4.7 sister  7.2    0.9004   divJ 0.0426   2tp / 28fp / 17fn
#   divergence 4.0            0.9024   divJ 0.0612   3tp / 30fp / 16fn   <- this
#   both tightenings          0.9023   divJ 0.0526   2tp / 19fp / 17fn
#
# Divergence is the lever that works. Raising it from 2.25 to 4.0 um cuts false
# divisions from 43 to 30 while keeping all three true ones, where tightening the
# distance gates instead costs a true positive to remove the same false ones.
# That is what the constraint is for: post-mitotic sisters move apart, and two
# detections of one cell do not, so a divergence threshold separates the two
# populations where a distance threshold only thins both.
#
# The edge term pays a small price, 0.8975 to 0.8962. Each added fork attaches an
# orphan to a component, which rescues that orphan and sometimes its whole short
# track from `prune_isolated` and the short-track filter, so nodes go back up.
# A false division therefore costs twice, once as a false edge and once through
# the node-count penalty. Worth stating because it bounds the downside: the total
# still improves, and the worst case here is a couple of thousandths.
name: unet50_ilp_calib_div
seed: 42

cv:
  scheme: leave_one_embryo_out

detect:
  backend: unet
  det_threshold: 0.9900
  pool_kernel_um: 5.0
  det_tta: false
  device: auto

link:
  backend: ilp
  edge_activation: softmax
  edge_threshold: 0.05
  max_link_um: 14.0
  ilp_edge_weight: -1.0
  # Left at the pack's values on purpose. The public 0.927 runs appearance 0.0
  # and disappearance 1.5; screened on 2026-08-28 those were rejected, appearance
  # being inert and disappearance splitting the embryos, 44b6 -0.0158 against
  # 6bba +0.0063. See NOTES.md.
  ilp_appearance_weight: 0.1
  ilp_disappearance_weight: 0.1
  ilp_division_weight: 1.0
  ilp_num_threads: 1
  ilp_gap: 0.0
  ilp_timeout_s: 1800
  ilp_total_budget_s: 28800

calibrate:
  enabled: true
  max_edge_um: 14.0
  single_parent: true
  gap_close: true
  gap_close_um: 6.0
  gap_reuse_um: 3.2
  gap_max_added_frac: 0.05
  gap_max_added_abs: 2000
  prune_isolated: true
  min_track_len: 6
  linefit_smooth: true
  linefit_weight: 0.8
  linefit_window: 2
  # The one variable.
  safe_divisions: true
  safe_div_parent_um: 8.0
  safe_div_sister_um: 11.0
  safe_div_child_um: 10.0
  safe_div_divergence_um: 4.0
  safe_div_frame_frac: 0.0076
  safe_div_global_frac: 0.00375
